[package]
name = "ai-powerbi-studio"
version = "0.1.0"
description = "Modelcraft — Your AI workspace for Power BI"
authors = ["Modelcraft"]
edition = "2021"

[lib]
name = "ai_powerbi_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compile the native source on CI without copying unqualified release payloads.
source-check = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.5"
