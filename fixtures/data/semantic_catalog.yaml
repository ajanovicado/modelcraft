version: 1.0.0
metrics:
  - id: net_sales
    name: Net Sales
    aliases: [revenue, sales]
    description: Revenue after contractual and transactional discounts.
    format: "$,.0f"
    powerbi_ref: "'Measures'[Net Sales]"
    sql_expression: "SUM(net_sales)"
    allowed_dimensions: [month, region, product, category, segment, channel]
    dependencies: []
  - id: units
    name: Units
    aliases: [volume, quantity]
    description: Number of units sold.
    format: ",.0f"
    powerbi_ref: "'Measures'[Units]"
    sql_expression: "SUM(units)"
    allowed_dimensions: [month, region, product, category, segment, channel]
    dependencies: []
  - id: gross_profit
    name: Gross Profit
    aliases: [profit, gp]
    description: Net Sales less cost of goods sold.
    format: "$,.0f"
    powerbi_ref: "'Measures'[Gross Profit]"
    sql_expression: "SUM(gross_profit)"
    allowed_dimensions: [month, region, product, category, segment, channel]
    dependencies: [net_sales]
  - id: gross_margin_pct
    name: Gross Margin %
    aliases: [margin, margin percent, gross margin]
    description: Gross Profit divided by Net Sales.
    format: ".1%"
    powerbi_ref: "'Measures'[Gross Margin %]"
    sql_expression: "SUM(gross_profit) / NULLIF(SUM(net_sales), 0)"
    allowed_dimensions: [month, region, product, category, segment, channel]
    dependencies: [gross_profit, net_sales]
  - id: average_selling_price
    name: Average Selling Price
    aliases: [asp, selling price]
    description: Net Sales divided by Units.
    format: "$,.2f"
    powerbi_ref: "'Measures'[Average Selling Price]"
    sql_expression: "SUM(net_sales) / NULLIF(SUM(units), 0)"
    allowed_dimensions: [month, region, product, category, segment, channel]
    dependencies: [net_sales, units]
  - id: discount_rate
    name: Discount Rate
    aliases: [discount, average discount]
    description: Discount dollars divided by gross list-price value.
    format: ".1%"
    powerbi_ref: "'Measures'[Discount Rate]"
    sql_expression: "1 - SUM(net_sales) / NULLIF(SUM(units * list_price), 0)"
    allowed_dimensions: [month, region, product, category, segment, channel]
    dependencies: [net_sales, units]
  - id: unit_cost
    name: Unit Cost
    aliases: [cost per unit, cpu]
    description: Cost of goods sold divided by Units.
    format: "$,.2f"
    powerbi_ref: "'Measures'[Unit Cost]"
    sql_expression: "SUM(cogs) / NULLIF(SUM(units), 0)"
    allowed_dimensions: [month, region, product, category, segment, channel]
    dependencies: [units]
  - id: sales_growth
    name: Sales Growth
    aliases: [revenue growth, growth]
    description: Change in Net Sales versus the governed comparison period.
    format: ".1%"
    powerbi_ref: "'Measures'[Sales Growth]"
    sql_expression: "SUM(net_sales)"
    allowed_dimensions: [region, product, category, segment, channel]
    dependencies: [net_sales]
dimensions:
  - id: month
    name: Month
    aliases: [month start, period]
    column: month_start
    powerbi_ref: "'Dim Date'[Month Start]"
    data_type: date
  - id: region
    name: Region
    aliases: [market, geography]
    column: region
    powerbi_ref: "'Dim Region'[Region]"
    data_type: string
  - id: product
    name: Product
    aliases: [sku, item]
    column: product
    powerbi_ref: "'Dim Product'[Product]"
    data_type: string
  - id: category
    name: Category
    aliases: [product category]
    column: category
    powerbi_ref: "'Dim Product'[Category]"
    data_type: string
  - id: segment
    name: Segment
    aliases: [customer segment]
    column: segment
    powerbi_ref: "'Dim Customer'[Segment]"
    data_type: string
  - id: channel
    name: Channel
    aliases: [sales channel]
    column: channel
    powerbi_ref: "'Dim Channel'[Channel]"
    data_type: string
